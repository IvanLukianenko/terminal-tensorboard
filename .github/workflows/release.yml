name: Release

# Three ways in, all producing the same archives:
#   git push origin v0.3.0            — tag, publishes a release
#   git push origin release/v0.3.0    — branch, the workflow makes the tag and
#                                       publishes the same release from it
#   Actions tab -> Run workflow       — no tag, archives as run artifacts only
# The branch form exists so a release can be cut without anyone holding
# tag-push rights locally.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # static: runs on any Linux, no glibc version to match. Rust ships
          # a self-contained musl, so no cross C toolchain is needed here.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install cross-build packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_env=$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_env}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          # read from Cargo.toml rather than cargo metadata + a JSON tool:
          # this step runs under Git Bash on the Windows runner too
          version=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' Cargo.toml | head -1)
          name="ttb-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ttb.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/ttb" "dist/${name}/"
          fi
          cp README.md "dist/${name}/"
          [ -f LICENSE ] && cp LICENSE "dist/${name}/" || true
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Available on every run, tagged or not, from the run's summary page.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download every build
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # files only: a glob would also pick up any unpacked directory
          find . -maxdepth 1 -type f -name 'ttb-*' -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag push releases itself; a release/<tag> branch names the tag,
          # which gh creates at this commit
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          gh release create "$tag" \
            --target "${GITHUB_SHA}" \
            --title "$tag" \
            --generate-notes \
            dist/ttb-* dist/SHA256SUMS
