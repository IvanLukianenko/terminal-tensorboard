[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-tensorboard"
version = "0.1.0"
description = "A lightning-fast terminal UI for viewing TensorBoard training logs"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ivan Lukianenko" }]
keywords = ["tensorboard", "tui", "terminal", "machine-learning", "training", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.scripts]
ttb = "terminal_tensorboard.cli:main"
terminal-tensorboard = "terminal_tensorboard.cli:main"

[project.urls]
Homepage = "https://github.com/IvanLukianenko/terminal-tensorboard"

[tool.setuptools]
packages = ["terminal_tensorboard"]
